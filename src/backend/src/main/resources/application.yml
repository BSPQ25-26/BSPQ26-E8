server:
  port: ${PORT:10000}
  address: 0.0.0.0

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:app_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:BSPQ26E8}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:skillissue}}
    hikari:
      connection-timeout: 60000
      initialization-fail-timeout: 60000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    connect-retries: 10
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

security:
  access-token:
    secret: ${ACCESS_TOKEN_SECRET:bspq26e8-dev-access-token-secret}
