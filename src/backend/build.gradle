plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'jacoco'

}

group = 'com.bspq26e8'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'
    testImplementation 'org.mockito:mockito-core:5.+'
    testImplementation 'io.rest-assured:rest-assured'

}


tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests backed by Testcontainers.'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'integration'
    }
    shouldRunAfter tasks.test
}

jacoco {
    toolVersion = '0.8.12'
}

def jacocoCoverageExclusions = [
        'com/bspq26e8/backend/BackendApplication.class',
        'com/bspq26e8/backend/codeexecution/*',
        'com/bspq26e8/backend/**/controller/*',
        'com/bspq26e8/backend/**/entity/*',
        'com/bspq26e8/backend/**/repository/*'
]

tasks.named('jacocoTestReport') {
    dependsOn tasks.test
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: jacocoCoverageExclusions)
            })
    )
    reports {
        xml.required = false
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(
            files(classDirectories.files.collect {
                fileTree(dir: it, exclude: jacocoCoverageExclusions)
            })
    )
    violationRules {
        rule {
            limit {
                    counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }


}


tasks.named('check') {
    dependsOn tasks.jacocoTestCoverageVerification
    dependsOn tasks.integrationTest
}
