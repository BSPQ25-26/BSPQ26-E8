<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Realcode — Problem Practive Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <!-- Estilos específicos de la página -->
  <link rel="stylesheet" href="css/index.css" />
</head>
<body data-active-nav="home">

  <!-- Background Geometry -->
  <div class="background-geometry">
    <div class="shape shape-circle"></div>
    <div class="shape shape-square"></div>
    <div class="shape shape-triangle"></div>
    <div class="shape shape-dots"></div>
  </div>

  <main class="hero page z-forward">

    <div class="hero-left anim-fade-up anim-delay-1">
      <h1 class="title">Realcode</h1>
      <div class="cta-group">
        <a href="problems.html" class="btn-primary">Explore Problems →</a>
        <a href="#" class="btn-secondary">Log Out</a>
      </div>
    </div>

    <div class="hero-right anim-fade-left anim-delay-3">
      <a href="problems.html" class="card card--blue screen-card">
        <span class="badge badge--blue">01</span>
        <span class="screen-label">Home / Search</span>
        <span class="screen-arrow">→</span>
      </a>
      <a href="create.html" class="card card--green screen-card">
        <span class="badge badge--easy">02</span>
        <span class="screen-label">Problem Creation</span>
        <span class="screen-arrow">→</span>
      </a>
    </div>

  </main>

  <!-- Core utilities -->
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const isAuthenticated = typeof auth !== 'undefined' ? auth.isAuthenticated() : localStorage.getItem('session_token');
      
      const ctaGroup = document.querySelector('.cta-group');
      if (ctaGroup) {
        if (isAuthenticated) {
          ctaGroup.innerHTML = `
            <a href="problems.html" class="btn-primary">Explore Problems →</a>
            <a href="#" class="btn-secondary" onclick="auth.logout(); return false;">Log Out</a>
          `;
        } else {
          ctaGroup.innerHTML = `
            <a href="login.html" class="btn-primary">Log In to Continue</a>
          `;
          
          // Disable proceeding to other core pages via right-side cards
          document.querySelectorAll('.screen-card').forEach(card => {
            card.href = 'login.html';
          });
        }
      }
    });
  </script>
</body>
</html>
