<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problems — LeetCode Mini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/problems.css" />
</head>
<body data-active-nav="problems">

  <main class="page">
    <div class="problems-layout">

      <div class="problems-header anim-fade-up">
        <h1 class="problems-title">Problems</h1>
        <div class="problems-filters">
          <select class="form-select" id="filter-difficulty">
            <option value="">All difficulties</option>
            <option value="EASY">Easy</option>
            <option value="MEDIUM">Medium</option>
            <option value="HARD">Hard</option>
          </select>
        </div>
      </div>

      <div id="problems-grid" class="problems-grid anim-fade-up anim-delay-1">
        <!-- Cards injected by problems.js -->
      </div>

      <p id="problems-status" class="problems-status"></p>

    </div>
  </main>

  <!-- Core utilities (optional - available for use) -->
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

  <!-- Page script -->
  <script src="js/problems.js"></script>
</body>
</html>
