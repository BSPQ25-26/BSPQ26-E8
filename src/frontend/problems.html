<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problems — Realcode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/problems.css" />
</head>
<body data-active-nav="problems" data-page-title-key="page.title.problems">

  <!-- Moving Shapes Background -->
  <ul class="bg-shapes">
    <li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li>
  </ul>

  <main class="page">
    <div class="problems-layout">

      <div class="problems-header anim-fade-up">
        <div class="problems-heading">
          <h1 class="problems-title">Problems</h1>
        </div>
        <div class="problems-controls">
          <input
            class="form-input problems-search"
            id="search-name"
            type="search"
            placeholder="Search by name"
            data-i18n-placeholder="problems.searchPlaceholder"
            autocomplete="off"
          />

          <select class="form-select" id="filter-difficulty">
            <option value="" data-i18n="problems.allDifficulties">All difficulties</option>
            <option value="EASY" data-i18n="problems.difficultyEasy">Easy</option>
            <option value="MEDIUM" data-i18n="problems.difficultyMedium">Medium</option>
            <option value="HARD" data-i18n="problems.difficultyHard">Hard</option>
          </select>

          <select class="form-select" id="filter-language">
            <option value="" data-i18n="problems.allLanguages">All languages</option>
            <option value="python" data-i18n="problems.languagePython">Python</option>
            <option value="javascript" data-i18n="problems.languageJavaScript">JavaScript</option>
            <option value="java" data-i18n="problems.languageJava">Java</option>
            <option value="cpp" data-i18n="problems.languageCpp">C++</option>
          </select>

          <div class="problems-sort-clear">
            <select class="form-select" id="filter-sort">
              <option value="difficulty_name" data-i18n="problems.sortDifficulty">Difficulty</option>
              <option value="alphabetical" data-i18n="problems.sortAlphabetical">Alphabetical</option>
              <option value="created_at" data-i18n="problems.sortCreationDate">Creation date</option>
            </select>
            <button type="button" class="problems-clear" id="clear-filters" aria-label="Clear filters" data-i18n-aria-label="problems.clearFilters">X</button>
          </div>
        </div>
        <p id="problems-count" class="problems-count">0 problems found</p>
      </div>

      <div id="problems-grid" class="problems-grid anim-fade-up anim-delay-1">
        <!-- Cards injected by problems.js -->
      </div>

      <p id="problems-status" class="problems-status"></p>

    </div>
  </main>

  <!-- Core utilities -->
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

  <!-- Page script -->
  <script src="js/problems.js"></script>
</body>
</html>
