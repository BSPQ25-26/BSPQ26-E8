<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Problem — LeetCode Mini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="create.css" />
</head>
<body>

  <div class="accent-bar"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">
      ⌨ LeetCode Mini
    </a>
    <ul class="nav-links">
      <li><a href="problems.html">Problems</a></li>
      <li><a href="create.html" class="active">Create</a></li>
      <li><a href="profile.html">Profile</a></li>
    </ul>
  </nav>

  <main class="page">
    <div class="form-container anim-fade-up">
      <h1 class="page-title">Create Problem</h1>

      <form class="problem-form" id="create-form">
        
        <div class="grid-row grid-3-1">
          <div class="form-group">
            <label class="form-label">Title</label>
            <input class="form-input" type="text" id="title" placeholder="e.g. Two Sum" />
          </div>
          <div class="form-group">
            <label class="form-label">ID</label>
            <input class="form-input" type="text" placeholder="e.g. 1" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="statementMd" placeholder="Problem statement here..."></textarea>
        </div>

        <div class="form-group" style="width: 200px;">
          <label class="form-label">Difficulty</label>
          <select class="form-select" id="difficulty">
            <option value="" disabled selected>Select…</option>
            <option value="EASY">Easy</option>
            <option value="MEDIUM">Medium</option>
            <option value="HARD">Hard</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Solutions</label>
          <textarea class="form-textarea" id="solutionTemplate" placeholder="Explain the optimal approach..."></textarea>
        </div>

        <div class="card">
          <div class="section-header">
            <h3 class="section-title">Examples</h3>
            <button type="button" class="btn-secondary btn-sm">+ Add</button>
          </div>
          <div class="example-box">
            <div class="form-group">
              <input class="form-input" type="text" placeholder="Input (e.g. nums = [2,7,11,15], target = 9)" />
            </div>
            <div class="form-group">
              <input class="form-input" type="text" placeholder="Output (e.g. [0,1])" />
            </div>
            <div class="form-group">
              <input class="form-input" type="text" placeholder="Explanation (optional)" />
            </div>
          </div>
        </div>

        <div class="card card--blue">
          <div class="section-header">
            <h3 class="section-title">Test cases</h3>
            <button type="button" class="btn-secondary btn-sm">+ Add</button>
          </div>
          <div class="grid-row grid-1-1">
            <div class="form-group">
              <input class="form-input" type="text" placeholder="Input" />
            </div>
            <div class="form-group">
              <input class="form-input" type="text" placeholder="Expected Output" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Constraints</label>
          <textarea class="form-textarea" id="constraintsMd" style="min-height: 80px;" placeholder="e.g. 2 <= nums.length <= 10^4"></textarea>
        </div>

        <div class="grid-row grid-1-1">
          <div class="card">
            <h3 class="section-title" style="margin-bottom: 1rem;">Setup script (optional)</h3>
            <div class="form-group">
              <textarea class="form-textarea" placeholder="Setup code..."></textarea>
            </div>
            <div class="form-group" style="margin-top: 1rem;">
              <input class="form-input" type="text" placeholder="Setup output..." />
            </div>
          </div>

          <div class="card">
            <h3 class="section-title" style="margin-bottom: 1rem;">Solution Runner</h3>
            <div class="form-group">
              <textarea class="form-textarea" placeholder="Python runner code..." style="margin-bottom: 1rem;"></textarea>
            </div>
            <div class="form-group">
              <textarea class="form-textarea" placeholder="Java runner code..."></textarea>
            </div>
          </div>
        </div>

        <div class="grid-row grid-1-1-1">
          <div class="form-group">
            <label class="form-label">Memory limit</label>
            <select class="form-select">
              <option>256 MB</option>
              <option>512 MB</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Time limit</label>
            <select class="form-select">
              <option>1 s</option>
              <option>2 s</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Points</label>
            <input class="form-input" type="number" placeholder="100" />
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary">Save as Draft</button>
          <button type="submit" class="btn-primary" id="submit-btn">Publish</button>
          <span id="status-message"></span>
        </div>

      </form>
    </div>
  </main>

  <div class="bottom-strip">
    Frontend UI · Custom design
  </div>

  <script src="create.js"></script>
</body>
</html>
