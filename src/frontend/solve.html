<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solve — Realcode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/solve.css" />
</head>
<body data-active-nav="problems" data-page-title-key="page.title.solve">

  <!-- Navbar injected by layout.js -->

  <div class="solve-layout">

    <!-- ── LEFT: Problem description ── -->
    <aside class="solve-panel solve-panel--desc">

      <!-- Tabs -->
      <div class="solve-tabs">
        <button class="solve-tab is-active" data-tab="description" data-i18n="solve.tabDescription">Description</button>
        <button class="solve-tab" data-tab="examples" data-i18n="solve.tabExamples">Examples</button>
        <button class="solve-tab" data-tab="hints" data-i18n="solve.tabHints">Hints</button>
      </div>

      <!-- Description tab -->
      <div class="solve-tab-content" id="tab-description">
        <div id="problem-header">
          <p class="solve-loading" data-i18n="solve.loadingProblem">Loading problem…</p>
        </div>
        <div id="problem-statement"></div>
      </div>

      <!-- Examples tab -->
      <div class="solve-tab-content" id="tab-examples" style="display:none;">
        <div id="problem-examples">
          <p class="solve-loading" data-i18n="solve.loading">Loading…</p>
        </div>
      </div>

      <!-- Hints tab -->
      <div class="solve-tab-content" id="tab-hints" style="display:none;">
        <div id="problem-hints">
          <p class="solve-hints-empty" data-i18n="solve.noHints">No hints available for this problem.</p>
        </div>
      </div>

    </aside>

    <!-- ── Draggable divider ── -->
    <div class="solve-divider" id="solve-divider"></div>

    <!-- ── RIGHT: Code editor ── -->
    <main class="solve-panel solve-panel--editor">

      <!-- Toolbar -->
      <div class="solve-editor-toolbar">
        <select class="solve-lang-select" id="lang-select">
          <option value="python">Python</option>
          <option value="java">Java</option>
          <option value="cpp">C++</option>
          <option value="javascript">JavaScript</option>
        </select>
        <div class="solve-toolbar-actions">
          <button type="button" class="btn-secondary btn-sm" id="btn-run" data-i18n="solve.runButton">▶ Run</button>
          <button type="button" class="btn-primary btn-sm" id="btn-submit" data-i18n="solve.submitButton">Submit</button>
        </div>
      </div>

      <!-- Code editor -->
      <div class="solve-editor-wrap">
        <textarea
          class="solve-editor"
          id="code-editor"
          spellcheck="false"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          data-i18n-placeholder="solve.editorPlaceholder"
          placeholder="// Write your solution here…"
        ></textarea>
      </div>

      <!-- Output panel (hidden until run/submit) -->
      <div class="solve-output" id="solve-output" style="display:none;">
        <div class="solve-output-header">
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <span class="solve-output-title" data-i18n="solve.outputTitle">Output</span>
            <span class="solve-output-status" id="output-status"></span>
          </div>
          <button type="button" class="solve-output-close" id="btn-close-output" title="Close" data-i18n-title="solve.closeButton">✕</button>
        </div>
        <div class="solve-output-body" id="output-body">
          <div class="run-output" id="run-output" hidden>
            <div class="run-output-cmdline">
              <span class="run-output-prompt">$</span>
              <span class="run-output-cmd">run sample-tests</span>
              <span class="run-output-cmd-meta" id="run-meta"></span>
            </div>
            <div class="run-output-metrics">
              <span>time: <span id="run-time">—</span></span>
              <span>mem: <span id="run-mem">—</span></span>
              <span>pass: <span id="run-pass">—</span></span>
            </div>
            <div class="run-output-cases" id="run-cases">
              <div class="run-output-empty" data-i18n="solve.awaitingJudge">awaiting Judge0…</div>
            </div>
            <pre class="run-output-error" id="run-error" hidden></pre>
          </div>
          <pre class="solve-output-plain" id="output-plain"></pre>
        </div>
      </div>

    </main>
  </div>

  <!-- Core utilities -->
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

  <!-- Page script -->
  <script src="js/solve.js"></script>
</body>
</html>
