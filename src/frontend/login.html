<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Realcode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    .login-card {
      max-width: 420px;
      margin: 4rem auto;
    }
    .login-card h1 {
      font-size: 1.4rem;
      margin-bottom: 1.5rem;
    }
    .login-card .btn-primary {
      width: 100%;
      margin-top: 1rem;
      justify-content: center;
    }
    .login-card p {
      margin-top: 1.25rem;
      font-size: 0.82rem;
      color: var(--text-mid);
      text-align: center;
    }
    .login-card p a {
      color: var(--accent-light);
      text-decoration: underline;
      cursor: pointer;
    }
    #error-message {
      display: none;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--red, #ef4444);
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 4px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body data-active-nav="login" data-page-title-key="page.title.login">

  <main class="page">
    <div class="login-card card anim-fade-up">

      <h1 id="form-title" data-i18n="login.signIn">Sign In</h1>

      <p id="error-message"></p>

      <!-- Login panel -->
      <div id="login-panel">
        <form id="login-form">
          <div class="form-group">
            <label class="form-label" data-i18n="login.email">Email</label>
            <input class="form-input" type="email" id="login-email" placeholder="you@example.com" data-i18n-placeholder="login.email" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="login.password">Password</label>
            <input class="form-input" type="password" id="login-password" placeholder="••••••••" data-i18n-placeholder="login.password" />
          </div>
          <button type="submit" class="btn-primary" id="login-btn" data-i18n="login.signIn">Sign In</button>
        </form>
        <p><span data-i18n="login.noAccount">No account?</span> <a href="#" id="show-register" data-i18n="login.register">Register</a></p>
      </div>

      <!-- Register panel (hidden by default) -->
      <div id="register-panel" style="display:none">
        <form id="register-form">
          <div class="form-group">
            <label class="form-label" data-i18n="login.email">Email</label>
            <input class="form-input" type="email" id="register-email" placeholder="you@example.com" data-i18n-placeholder="login.email" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="login.username">Username</label>
            <input class="form-input" type="text" id="register-username" placeholder="yourhandle" data-i18n-placeholder="login.username" />
          </div>
          <div class="form-group">
            <label class="form-label" data-i18n="login.password">Password</label>
            <input class="form-input" type="password" id="register-password" placeholder="••••••••" data-i18n-placeholder="login.password" />
          </div>
          <button type="submit" class="btn-primary" id="register-btn" data-i18n="login.createAccount">Create Account</button>
        </form>
        <p><span data-i18n="login.alreadyHaveAccount">Already have an account?</span> <a href="#" id="show-login" data-i18n="login.signIn">Sign In</a></p>
      </div>

    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
