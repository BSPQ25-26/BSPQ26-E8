<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Realcode</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />

  <style>
    .profile-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem var(--page-padding);
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.5rem;
      align-items: start;
    }

    .avatar-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      border: 3px solid var(--border);
      overflow: hidden;
      background: var(--panel);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* URL edit form for profile picture */
    .avatar-url-form {
      display: none;
      flex-direction: column;
      gap: 0.4rem;
      width: 100%;
    }

    .avatar-url-form.open {
      display: flex;
    }

    .avatar-url-input {
      background: var(--input-bg, var(--panel));
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--white);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      padding: 0.4rem 0.6rem;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }

    .avatar-url-input:focus {
      border-color: var(--accent);
    }

    .avatar-url-input::placeholder {
      color: var(--text-dim);
    }

    .avatar-url-actions {
      display: flex;
      gap: 0.4rem;
    }

    .avatar-url-save {
      flex: 1;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #000;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .avatar-url-save:hover { opacity: 0.85; }
    .avatar-url-save:disabled { opacity: 0.4; cursor: not-allowed; }

    .avatar-url-cancel {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.35rem 0;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .avatar-url-cancel:hover { color: var(--white); border-color: var(--white); }

    .avatar-url-status {
      font-size: 0.68rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      min-height: 1rem;
      text-align: center;
    }

    .avatar-url-status.error { color: var(--red, #f87171); }

    .avatar-change-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .avatar-change-btn:hover { color: var(--accent); border-color: var(--accent); }

    .profile-name {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--white);
    }

    .profile-role {
      font-size: 0.78rem;
      color: var(--text-mid);
    }

    .sidebar-section-title {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0 1.25rem 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-edit-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.15rem 0.45rem;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }

    .sidebar-edit-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.75rem 1.25rem 1.25rem;
    }

    /* Preferred languages edit panel */
    .lang-edit-panel {
      display: none;
      padding: 0.5rem 1.25rem 1rem;
      flex-direction: column;
      gap: 0.5rem;
    }

    .lang-edit-panel.open {
      display: flex;
    }

    .lang-checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .lang-checkbox-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .lang-checkbox-item input[type="checkbox"] {
      accent-color: var(--accent);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .lang-checkbox-item span {
      font-size: 0.8rem;
      color: var(--text-mid);
      font-family: var(--font-mono);
    }

    .lang-save-btn {
      margin-top: 0.5rem;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #000;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      transition: opacity 0.15s;
      align-self: flex-start;
    }

    .lang-save-btn:hover { opacity: 0.85; }
    .lang-save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .lang-save-status {
      font-size: 0.7rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
      min-height: 1rem;
    }

    /* ── Right column ── */
    .profile-main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .stat-box {
      background: var(--card);
      padding: 1.25rem 1rem;
      text-align: center;
      transition: background 0.2s;
    }
    .stat-box:hover { background: var(--panel); }

    .stat-number {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .stat-number.green  { color: var(--green); }
    .stat-number.orange { color: var(--orange); }
    .stat-number.red    { color: var(--red); }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Section header */
    .section-header {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-header::before { content: '//'; color: var(--accent); }

    .card-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .card-header-row .section-header {
      margin-bottom: 0;
    }

    .submission-view-actions {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .submission-view-btn {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-mid);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.35rem 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .submission-view-btn:hover,
    .submission-view-btn.is-active {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(108, 99, 255, 0.1);
    }

    .submission-view-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .submission-problem-filter {
      min-width: 12rem;
      max-width: 18rem;
      padding: 0.35rem 0.55rem;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-mid);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      outline: none;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .submission-problem-filter:hover,
    .submission-problem-filter:focus {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(108, 99, 255, 0.1);
    }

    .submission-problem-filter option {
      color: var(--text);
      background: var(--panel);
    }

    /* Table columns */
    .col-title { width: 100%; }
    .col-diff  { white-space: nowrap; }
    .col-date  {
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    /* ── My Problems actions ── */
    .btn-danger {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.08);
      color: var(--red);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: var(--red);
    }

    .profile-empty {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--text-mid);
      text-align: center;
      padding: 1.5rem 0;
    }

    .submission-status {
      text-transform: uppercase;
    }

    .best-submission-tag {
      margin-left: 0.4rem;
      color: var(--green);
      background: rgba(34,197,94,0.12);
      border-color: rgba(34,197,94,0.3);
      text-transform: uppercase;
    }

    .retry-submission-btn {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--accent-light);
      background: rgba(108,99,255,0.08);
      border: 1px solid rgba(108,99,255,0.35);
      border-radius: 4px;
      padding: 0.35rem 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }

    .retry-submission-btn:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(108,99,255,0.16);
    }

    .submission-status--accepted,
    .submission-status--completed,
    .submission-status--passed {
      color: var(--green);
      background: rgba(34,197,94,0.12);
      border-color: rgba(34,197,94,0.3);
    }

    .submission-status--queued,
    .submission-status--running {
      color: var(--orange);
      background: rgba(245,158,11,0.12);
      border-color: rgba(245,158,11,0.3);
    }

    .submission-status--failed,
    .submission-status--wrong_answer,
    .submission-status--runtime_error,
    .submission-status--compile_error,
    .submission-status--compilation_error,
    .submission-status--time_limit_exceeded,
    .submission-status--memory_limit_exceeded,
    .submission-status--internal_error {
      color: var(--red);
      background: rgba(239,68,68,0.12);
      border-color: rgba(239,68,68,0.3);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .profile-page {
        grid-template-columns: 1fr;
        padding: 1.5rem 1.25rem;
      }
    }

    @media (max-width: 480px) {
      .submission-view-actions {
        width: 100%;
        align-items: stretch;
        flex-direction: column;
      }

      .submission-view-btn,
      .submission-problem-filter {
        width: 100%;
      }

      .stats-row {
        grid-template-columns: 1fr;
        gap: 0;
      }

      .stat-box {
        border-bottom: 1px solid var(--border);
      }

      .stat-box:last-child {
        border-bottom: none;
      }
    }
  </style>
</head>
<body data-active-nav="profile" data-page-title-key="page.title.profile">

  <main class="page">
    <div class="profile-page">

      <!-- ── LEFT: Sidebar ── -->
      <aside class="profile-sidebar anim-fade-up anim-delay-1">

        <!-- Avatar + name -->
        <div class="card avatar-card">
          <div class="avatar" aria-hidden="true">
            <img
              class="avatar-img"
              id="avatar-img"
              src="https://i.pravatar.cc/320?img=12"
              alt="Profile avatar"
            />
          </div>
          <button class="avatar-change-btn" id="avatar-change-btn">Change photo</button>
          <div class="avatar-url-form" id="avatar-url-form">
            <input
              class="avatar-url-input"
              id="avatar-url-input"
              type="url"
              placeholder="https://lh3.googleusercontent.com/..."
            />
            <div class="avatar-url-actions">
              <button class="avatar-url-save" id="avatar-url-save">Save</button>
              <button class="avatar-url-cancel" id="avatar-url-cancel">Cancel</button>
            </div>
            <p class="avatar-url-status" id="avatar-url-status"></p>
          </div>
          <p class="profile-name" id="profile-username">username</p>
          <span class="badge badge--blue" data-i18n="profile.activeStatus">is_active</span>
          <p class="profile-role">Software Quality · Deusto</p>
        </div>

        <!-- Used languages (from submissions) -->
        <div class="card" style="padding: 1rem 0 0.25rem;">
          <p class="sidebar-section-title" data-i18n="profile.usedLanguages">Used Languages</p>
          <div class="tag-list" id="profile-used-languages">
            <span class="badge badge--blue">-</span>
          </div>
        </div>

        <!-- Preferred languages (user-configurable) -->
        <div class="card" style="padding: 1rem 0 0.25rem;">
          <p class="sidebar-section-title">
            Preferred Languages
            <button class="sidebar-edit-btn" id="lang-edit-btn">Edit</button>
          </p>
          <div class="tag-list" id="profile-preferred-languages">
            <span class="badge badge--blue">None</span>
          </div>
          <div class="lang-edit-panel" id="lang-edit-panel">
            <div class="lang-checkbox-list" id="lang-checkbox-list"></div>
            <button class="lang-save-btn" id="lang-save-btn">Save</button>
            <p class="lang-save-status" id="lang-save-status"></p>
          </div>
        </div>

      </aside>

      <!-- ── RIGHT: Main content ── -->
      <div class="profile-main anim-fade-left anim-delay-2">

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-number" id="profile-in-progress-count">0</div>
            <div class="stat-label" data-i18n="profile.inProgress">In Progress</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="profile-created-count">0</div>
            <div class="stat-label" data-i18n="profile.created">Created</div>
          </div>
          <div class="stat-box">
            <div class="stat-number" id="profile-submissions-count">0</div>
            <div class="stat-label" data-i18n="profile.submissions">Submissions</div>
          </div>
        </div>

        <!-- Difficulty breakdown -->
        <div class="card">
          <p class="section-header" data-i18n="profile.difficultyBreakdown">Difficulty Breakdown (Submissions)</p>
          <div style="display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--border); border-radius: 4px; overflow: hidden;">
            <div class="stat-box">
              <div class="stat-number green" id="profile-easy-submissions-count">0</div>
              <div class="stat-label" data-i18n="problems.difficultyEasy">Easy</div>
            </div>
            <div class="stat-box">
              <div class="stat-number orange" id="profile-medium-submissions-count">0</div>
              <div class="stat-label" data-i18n="problems.difficultyMedium">Medium</div>
            </div>
            <div class="stat-box">
              <div class="stat-number red" id="profile-hard-submissions-count">0</div>
              <div class="stat-label" data-i18n="problems.difficultyHard">Hard</div>
            </div>
          </div>
        </div>

        <!-- My Problems -->
        <div class="card">
          <p class="section-header" data-i18n="profile.myProblems">My Problems</p>
          <div id="my-problems-container">
            <p class="profile-empty" data-i18n="common.loading">Loading...</p>
          </div>
        </div>

        <!-- My Submissions -->
        <div class="card">
          <div class="card-header-row">
            <p class="section-header" data-i18n="profile.mySubmissions">My Submissions</p>
            <div class="submission-view-actions" aria-label="Submission view options" data-i18n-aria-label="profile.submissionViewOptions">
              <button type="button" class="submission-view-btn" id="show-latest-submission" data-i18n="profile.latestSubmission">Latest</button>
              <select class="submission-problem-filter" id="submission-problem-filter" data-i18n-aria-label="profile.filterByProblem" aria-label="Filter by problem">
                <option value="" data-i18n="profile.allSubmittedProblems">All submissions</option>
              </select>
            </div>
          </div>
          <div id="my-submissions-container">
            <p class="profile-empty" data-i18n="common.loading">Loading...</p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Core utilities -->
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

  <script>
    /* ── Profile list helpers ── */
    const DIFF_BADGE = {
      EASY:   'badge--easy',
      MEDIUM: 'badge--medium',
      HARD:   'badge--hard',
    };

    let lastProblems = [];
    let lastSubmissions = [];
    let allMineSubmissions = [];
    let lastProblemLookup = new Map();
    let currentSubmissionView = 'all';
    let selectedSubmissionProblemId = '';
    let bestSubmissionId = null;

    function getText(key, params) {
      return typeof i18n !== 'undefined' ? i18n.t(key, params) : key;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function formatProblemDate(isoDate) {
      if (!isoDate) return getText('common.unknownDate');
      const d = new Date(isoDate);
      return isNaN(d.getTime()) ? getText('common.unknownDate') : d.toLocaleDateString();
    }

    function getDifficultyLabel(difficulty) {
      const normalized = String(difficulty || '').toUpperCase();
      if (normalized === 'EASY') return getText('problems.difficultyEasy');
      if (normalized === 'MEDIUM') return getText('problems.difficultyMedium');
      if (normalized === 'HARD') return getText('problems.difficultyHard');
      return difficulty || getText('common.none');
    }

    function getStatusLabel(status) {
      const normalized = String(status || '').toUpperCase();
      const key = `profile.submissionStatus${normalized
        .toLowerCase()
        .split('_')
        .map(part => part.charAt(0).toUpperCase() + part.slice(1))
        .join('')}`;

      const translated = getText(key);
      return translated === key ? (status || getText('common.none')) : translated;
    }

    function getSubmissionBadgeClass(status) {
      const normalized = String(status || '').toLowerCase().replace(/[^a-z0-9_-]/g, '_');
      return `submission-status--${normalized}`;
    }

    function formatSubmissionTests(submission) {
      if (!submission || submission.testcasesTotal === null || submission.testcasesTotal === undefined) {
        return getText('common.none');
      }

      return `${submission.testcasesPassed || 0}/${submission.testcasesTotal}`;
    }

    function getProblemLabel(problemId) {
      const problem = lastProblemLookup.get(String(problemId));
      return problem && problem.title
        ? problem.title
        : getText('profile.problemFallback', { id: String(problemId || '').slice(0, 8) });
    }

    function normalizeApiList(value) {
      if (Array.isArray(value)) return value;
      if (value && Array.isArray(value.content)) return value.content;
      if (value && Array.isArray(value.items)) return value.items;
      if (value && Array.isArray(value.data)) return value.data;
      return [];
    }

    function buildProblemLookup(problems) {
      const lookup = new Map();
      normalizeApiList(problems).forEach((problem) => {
        if (problem && problem.id) {
          lookup.set(String(problem.id), problem);
        }
      });
      return lookup;
    }

    function setDisplayedSubmissionCount(count) {
      const submissionsCountElement = document.getElementById('profile-submissions-count');
      if (submissionsCountElement) {
        submissionsCountElement.textContent = String(count);
      }
    }

    async function loadProblemLookupForSubmissions(submissions) {
      let lookup = new Map();
      try {
        lookup = buildProblemLookup(await api.get('/problems'));
      } catch (_error) {
        lookup = new Map();
      }
      const missingProblemIds = [];
      const seen = new Set();

      normalizeApiList(submissions).forEach((submission) => {
        if (!submission || !submission.problemId) return;
        const problemId = String(submission.problemId);
        if (lookup.has(problemId) || seen.has(problemId)) return;
        seen.add(problemId);
        missingProblemIds.push(problemId);
      });

      const missingProblems = await Promise.all(
        missingProblemIds.map((problemId) => api.get(`/problems/${encodeURIComponent(problemId)}`).catch(() => null))
      );

      missingProblems.forEach((problem) => {
        if (problem && problem.id) {
          lookup.set(String(problem.id), problem);
        }
      });

      return lookup;
    }

    async function deleteProblem(id, row) {
      if (!confirm(getText('profile.confirmDeleteProblem'))) return;
      try {
        await api.delete(`/problems/${id}`);
        row.remove();
        const countEl = document.getElementById('profile-created-count');
        if (countEl) {
          const n = parseInt(countEl.textContent, 10);
          if (!isNaN(n)) countEl.textContent = String(Math.max(0, n - 1));
        }
      } catch (_err) {
        alert(getText('profile.deleteProblemFailed'));
      }
    }

    function renderMyProblems(problems) {
      const container = document.getElementById('my-problems-container');
      if (!container) return;
      lastProblems = Array.isArray(problems) ? problems.slice() : [];

      if (!problems || problems.length === 0) {
        container.innerHTML = `<p class="profile-empty">${getText('profile.noProblems')}</p>`;
        return;
      }

      const tbody = document.createElement('tbody');
      problems.forEach((problem) => {
        const tr = document.createElement('tr');
        const badgeClass = DIFF_BADGE[problem.difficulty] || 'badge--blue';
        tr.innerHTML = `
          <td class="col-title" style="font-weight:600; color:var(--text);">${escapeHtml(problem.title || getText('common.none'))}</td>
          <td class="col-diff"><span class="badge ${badgeClass}">${getDifficultyLabel(problem.difficulty)}</span></td>
          <td class="col-date">${formatProblemDate(problem.createdAt)}</td>
          <td style="white-space:nowrap; text-align:right;">
            <button class="btn-secondary btn-sm" data-edit="${problem.id}">${getText('profile.editProblem')}</button>
            <button class="btn-danger" data-delete="${problem.id}" style="margin-left:0.5rem;">${getText('profile.deleteProblem')}</button>
          </td>
        `;
        tr.querySelector('[data-edit]').addEventListener('click', () => {
          window.location.href = `edit.html?id=${problem.id}`;
        });
        tr.querySelector('[data-delete]').addEventListener('click', () => deleteProblem(problem.id, tr));
        tbody.appendChild(tr);
      });

      const thead = document.createElement('thead');
      thead.innerHTML = `
        <tr>
          <th class="col-title">${getText('profile.problemTitle')}</th>
          <th class="col-diff">${getText('create.difficulty')}</th>
          <th class="col-date">${getText('profile.created')}</th>
          <th></th>
        </tr>`;

      const table = document.createElement('table');
      table.className = 'table';
      table.appendChild(thead);
      table.appendChild(tbody);

      const wrapper = document.createElement('div');
      wrapper.className = 'table-wrapper';
      wrapper.appendChild(table);

      container.innerHTML = '';
      container.appendChild(wrapper);
    }

    function setSubmissionViewButtons(activeView, isLoading) {
      const latestButton = document.getElementById('show-latest-submission');
      const buttons = [latestButton].filter(Boolean);

      buttons.forEach((button) => {
        button.disabled = Boolean(isLoading);
        button.classList.toggle('is-active', button.dataset.view === activeView);
      });
    }

    function populateSubmissionProblemFilter(submissions) {
      const select = document.getElementById('submission-problem-filter');
      if (!select) return;

      const currentValue = selectedSubmissionProblemId || '';
      const problemIds = [];
      const seen = new Set();

      (Array.isArray(submissions) ? submissions : []).forEach((submission) => {
        if (!submission || !submission.problemId) return;
        const problemId = String(submission.problemId);
        if (seen.has(problemId)) return;
        seen.add(problemId);
        problemIds.push(problemId);
      });

      select.innerHTML = '';
      const allOption = document.createElement('option');
      allOption.value = '';
      allOption.textContent = getText('profile.allSubmittedProblems');
      select.appendChild(allOption);

      problemIds.forEach((problemId) => {
        const option = document.createElement('option');
        option.value = problemId;
        option.textContent = getProblemLabel(problemId);
        select.appendChild(option);
      });

      select.value = seen.has(currentValue) ? currentValue : '';
      selectedSubmissionProblemId = select.value;
    }

    function renderMySubmissions(submissions, problemLookup, options) {
      const container = document.getElementById('my-submissions-container');
      if (!container) return;
      const renderOptions = options || {};
      lastSubmissions = Array.isArray(submissions) ? submissions.slice() : [];
      lastProblemLookup = problemLookup instanceof Map ? problemLookup : new Map();
      currentSubmissionView = renderOptions.view || currentSubmissionView || 'all';
      bestSubmissionId = renderOptions.bestSubmissionId === undefined
        ? bestSubmissionId
        : renderOptions.bestSubmissionId;
      setSubmissionViewButtons(currentSubmissionView, false);
      populateSubmissionProblemFilter(allMineSubmissions);
      setDisplayedSubmissionCount(lastSubmissions.length);

      if (!submissions || submissions.length === 0) {
        const emptyKey = currentSubmissionView === 'all'
          ? 'profile.noSubmissions'
          : 'profile.noSubmissionForView';
        container.innerHTML = `<p class="profile-empty">${getText(emptyKey)}</p>`;
        return;
      }

      const tbody = document.createElement('tbody');
      submissions.forEach((submission) => {
        const tr = document.createElement('tr');
        const problemLabel = getProblemLabel(submission.problemId);
        const statusClass = getSubmissionBadgeClass(submission.status);
        const languageLabel = submission.languageName || submission.languageCode || getText('common.none');
        const isBest = bestSubmissionId && String(submission.id) === String(bestSubmissionId);
        const bestBadge = isBest
          ? `<span class="badge best-submission-tag">${getText('profile.bestSubmission')}</span>`
          : '';

        tr.innerHTML = `
          <td class="col-title" style="font-weight:600; color:var(--text);">${escapeHtml(problemLabel)}</td>
          <td class="col-diff"><span class="badge badge--blue">${escapeHtml(languageLabel)}</span></td>
          <td class="col-diff"><span class="badge submission-status ${statusClass}">${getStatusLabel(submission.status)}</span>${bestBadge}</td>
          <td class="col-diff">${formatSubmissionTests(submission)}</td>
          <td class="col-date">${formatProblemDate(submission.submittedAt)}</td>
          <td style="white-space:nowrap; text-align:right;">
            <button type="button" class="retry-submission-btn" data-retry-submission="${escapeHtml(submission.id)}">${getText('profile.retrySubmission')}</button>
          </td>
        `;
        tr.querySelector('[data-retry-submission]').addEventListener('click', () => {
          const targetProblemId = encodeURIComponent(submission.problemId || '');
          window.location.href = `solve.html?id=${targetProblemId}`;
        });
        tbody.appendChild(tr);
      });

      const thead = document.createElement('thead');
      thead.innerHTML = `
        <tr>
          <th class="col-title">${getText('profile.problemTitle')}</th>
          <th class="col-diff">${getText('nav.languageLabel')}</th>
          <th class="col-diff">${getText('profile.submissionStatus')}</th>
          <th class="col-diff">${getText('profile.submissionTests')}</th>
          <th class="col-date">${getText('profile.submittedAt')}</th>
          <th></th>
        </tr>`;

      const table = document.createElement('table');
      table.className = 'table';
      table.appendChild(thead);
      table.appendChild(tbody);

      const wrapper = document.createElement('div');
      wrapper.className = 'table-wrapper';
      wrapper.appendChild(table);

      container.innerHTML = '';
      container.appendChild(wrapper);
    }

    function showSubmissionsMessage(messageKey) {
      const container = document.getElementById('my-submissions-container');
      if (container) {
        container.innerHTML = `<p class="profile-empty">${getText(messageKey)}</p>`;
      }
    }

    async function showLatestSubmission() {
      if (typeof api === 'undefined') return;
      if (currentSubmissionView === 'latest') {
        currentSubmissionView = 'all';
        selectedSubmissionProblemId = '';
        bestSubmissionId = null;
        renderMySubmissions(allMineSubmissions, lastProblemLookup, { view: 'all', bestSubmissionId: null });
        return;
      }

      currentSubmissionView = 'latest';
      selectedSubmissionProblemId = '';
      bestSubmissionId = null;
      setSubmissionViewButtons(currentSubmissionView, true);

      try {
        const submission = await api.get('/submissions/mine/latest');
        renderMySubmissions(submission ? [submission] : [], lastProblemLookup, { view: 'latest' });
      } catch (_error) {
        renderMySubmissions([], lastProblemLookup, { view: 'latest' });
      }
    }

    async function showSubmissionsForProblem(problemId) {
      if (typeof api === 'undefined') return;
      selectedSubmissionProblemId = problemId || '';
      currentSubmissionView = selectedSubmissionProblemId ? 'problem' : 'all';
      bestSubmissionId = null;
      setSubmissionViewButtons(currentSubmissionView, true);

      if (!selectedSubmissionProblemId) {
        renderMySubmissions(allMineSubmissions, lastProblemLookup, { view: 'all', bestSubmissionId: null });
        return;
      }

      try {
        const [submissions, bestSubmission] = await Promise.all([
          api.get(`/submissions/mine?problemId=${encodeURIComponent(selectedSubmissionProblemId)}`),
          api.get(`/submissions/problem/${encodeURIComponent(selectedSubmissionProblemId)}/best`).catch(() => null),
        ]);
        renderMySubmissions(
          normalizeApiList(submissions),
          lastProblemLookup,
          {
            view: 'problem',
            bestSubmissionId: bestSubmission && bestSubmission.id ? bestSubmission.id : null,
          }
        );
      } catch (_error) {
        renderMySubmissions([], lastProblemLookup, { view: 'problem', bestSubmissionId: null });
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const ERROR_COUNT = '-1';
      let lastLanguageLabels = [];

      const translateLanguageLabel = (label) => {
        const normalized = String(label || '').trim().toLowerCase();

        if (normalized === 'python 3' || normalized === 'python') {
          return i18n.t('problems.languagePython');
        }
        if (normalized === 'node.js' || normalized === 'javascript' || normalized === 'js') {
          return i18n.t('problems.languageJavaScript');
        }
        if (normalized === 'java') {
          return i18n.t('problems.languageJava');
        }
        if (normalized === 'c++' || normalized === 'cpp') {
          return i18n.t('problems.languageCpp');
        }

        return String(label);
      };

      if (typeof auth !== 'undefined' && !auth.isAuthenticated() && !localStorage.getItem('session_token')) {
        window.location.href = 'login.html';
        return;
      }

      let currentUser = typeof auth !== 'undefined' ? auth.getUser() : null;
      const usernameElement = document.getElementById('profile-username');
      const inProgressCountElement = document.getElementById('profile-in-progress-count');
      const createdCountElement = document.getElementById('profile-created-count');
      const submissionsCountElement = document.getElementById('profile-submissions-count');
      const easySubmissionsCountElement = document.getElementById('profile-easy-submissions-count');
      const mediumSubmissionsCountElement = document.getElementById('profile-medium-submissions-count');
      const hardSubmissionsCountElement = document.getElementById('profile-hard-submissions-count');
      const usedLanguagesContainer = document.getElementById('profile-used-languages');
      const preferredLanguagesContainer = document.getElementById('profile-preferred-languages');
      const avatarImg = document.getElementById('avatar-img');
      const avatarChangeBtn = document.getElementById('avatar-change-btn');
      const avatarUrlForm = document.getElementById('avatar-url-form');
      const avatarUrlInput = document.getElementById('avatar-url-input');
      const avatarUrlSave = document.getElementById('avatar-url-save');
      const avatarUrlCancel = document.getElementById('avatar-url-cancel');
      const avatarUrlStatus = document.getElementById('avatar-url-status');
      const langEditBtn = document.getElementById('lang-edit-btn');
      const langEditPanel = document.getElementById('lang-edit-panel');
      const langCheckboxList = document.getElementById('lang-checkbox-list');
      const langSaveBtn = document.getElementById('lang-save-btn');
      const langSaveStatus = document.getElementById('lang-save-status');

      const setDifficultyCounts = (easyCount, mediumCount, hardCount) => {
        if (easySubmissionsCountElement) easySubmissionsCountElement.textContent = String(easyCount);
        if (mediumSubmissionsCountElement) mediumSubmissionsCountElement.textContent = String(mediumCount);
        if (hardSubmissionsCountElement) hardSubmissionsCountElement.textContent = String(hardCount);
      };

      const setUsedLanguages = (languageLabels) => {
        if (!usedLanguagesContainer) {
          return;
        }

        lastLanguageLabels = Array.isArray(languageLabels) ? languageLabels.slice() : [];

        usedLanguagesContainer.innerHTML = '';
        if (!Array.isArray(languageLabels) || languageLabels.length === 0) {
          const emptyBadge = document.createElement('span');
          emptyBadge.className = 'badge badge--blue';
          emptyBadge.textContent = i18n.t('profile.none');
          usedLanguagesContainer.appendChild(emptyBadge);
          return;
        }
        languageLabels.forEach((label) => {
          const badge = document.createElement('span');
          badge.className = 'badge badge--blue';
          badge.textContent = translateLanguageLabel(label);
          usedLanguagesContainer.appendChild(badge);
        });
      };

      const renderPreferredLanguages = (languages) => {
        if (!preferredLanguagesContainer) {
          return;
        }

        preferredLanguagesContainer.innerHTML = '';
        if (!Array.isArray(languages) || languages.length === 0) {
          const emptyBadge = document.createElement('span');
          emptyBadge.className = 'badge badge--blue';
          emptyBadge.textContent = i18n.t('profile.none');
          preferredLanguagesContainer.appendChild(emptyBadge);
          return;
        }

        languages.forEach((lang) => {
          const badge = document.createElement('span');
          badge.className = 'badge badge--blue';
          badge.textContent = lang && (lang.name || lang.code || lang.id)
            ? String(lang.name || lang.code || lang.id)
            : i18n.t('profile.none');
          preferredLanguagesContainer.appendChild(badge);
        });
      };

      document.addEventListener('realcode:localechange', () => {
        setUsedLanguages(lastLanguageLabels);
        renderPreferredLanguages(currentUser && currentUser.preferredLanguages ? currentUser.preferredLanguages : []);
        renderMyProblems(lastProblems);
        renderMySubmissions(lastSubmissions, lastProblemLookup, { view: currentSubmissionView });
      });

      const latestSubmissionButton = document.getElementById('show-latest-submission');
      const submissionProblemFilter = document.getElementById('submission-problem-filter');
      if (latestSubmissionButton) {
        latestSubmissionButton.dataset.view = 'latest';
        latestSubmissionButton.addEventListener('click', showLatestSubmission);
      }
      if (submissionProblemFilter) {
        submissionProblemFilter.addEventListener('change', () => {
          showSubmissionsForProblem(submissionProblemFilter.value);
        });
      }

      if (typeof api === 'undefined') {
        if (submissionsCountElement) {
          submissionsCountElement.textContent = ERROR_COUNT;
        }
        if (inProgressCountElement) {
          inProgressCountElement.textContent = ERROR_COUNT;
        }
        if (createdCountElement) {
          createdCountElement.textContent = ERROR_COUNT;
        }
      };

      if (typeof api === 'undefined') {
        if (submissionsCountElement) submissionsCountElement.textContent = ERROR_COUNT;
        if (inProgressCountElement) inProgressCountElement.textContent = ERROR_COUNT;
        if (createdCountElement) createdCountElement.textContent = ERROR_COUNT;
        setDifficultyCounts(ERROR_COUNT, ERROR_COUNT, ERROR_COUNT);
        setUsedLanguages([i18n.t('common.error')]);
        renderMySubmissions([], undefined, { view: 'all' });
        return;
      }

      // Always fetch fresh user data to get profilePicture and preferredLanguages
      if (currentUser && currentUser.id) {
        try {
          const freshUser = await api.get(`/users/${currentUser.id}`);
          if (freshUser) {
            currentUser = freshUser;
            if (typeof auth !== 'undefined') auth.setUser(currentUser);
          }
        } catch (_error) {
          // Keep cached user data on error
        }
      } else if (currentUser && currentUser.email) {
        try {
          const encodedEmail = encodeURIComponent(currentUser.email);
          const freshUser = await api.get(`/users/by-email?email=${encodedEmail}`);
          if (freshUser) {
            currentUser = freshUser;
            if (typeof auth !== 'undefined') auth.setUser(currentUser);
          }
        } catch (_error) {
          // Keep cached user data on error
        }
      }

      if (usernameElement && currentUser && currentUser.username) {
        usernameElement.textContent = currentUser.username;
      }

      // Apply profile picture if present
      if (avatarImg && currentUser && currentUser.profilePicture) {
        avatarImg.src = currentUser.profilePicture;
      }

      // Render preferred languages
      renderPreferredLanguages(currentUser && currentUser.preferredLanguages ? currentUser.preferredLanguages : []);

      // ── Avatar URL edit ────────────────────────────────────────────────────
      const openAvatarForm = () => {
        avatarUrlInput.value = (currentUser && currentUser.profilePicture) || '';
        avatarUrlStatus.textContent = '';
        avatarUrlStatus.className = 'avatar-url-status';
        avatarUrlForm.classList.add('open');
        avatarChangeBtn.style.display = 'none';
        avatarUrlInput.focus();
      };

      const closeAvatarForm = () => {
        avatarUrlForm.classList.remove('open');
        avatarChangeBtn.style.display = '';
        avatarUrlStatus.textContent = '';
      };

      if (avatarChangeBtn) {
        avatarChangeBtn.addEventListener('click', openAvatarForm);
      }

      if (avatarUrlCancel) {
        avatarUrlCancel.addEventListener('click', closeAvatarForm);
      }

      if (avatarUrlInput) {
        avatarUrlInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') avatarUrlSave.click();
          if (e.key === 'Escape') closeAvatarForm();
        });
      }

      if (avatarUrlSave) {
        avatarUrlSave.addEventListener('click', async () => {
          const url = avatarUrlInput.value.trim();

          if (!url) {
            avatarUrlStatus.textContent = 'Please enter a URL';
            avatarUrlStatus.className = 'avatar-url-status error';
            return;
          }

          if (!url.startsWith('http://') && !url.startsWith('https://')) {
            avatarUrlStatus.textContent = 'URL must start with https://';
            avatarUrlStatus.className = 'avatar-url-status error';
            return;
          }

          avatarUrlSave.disabled = true;
          avatarUrlStatus.textContent = 'Saving…';
          avatarUrlStatus.className = 'avatar-url-status';

          try {
            const updated = await api.put(`/users/${currentUser.id}/profile`, { profilePicture: url });
            if (updated) {
              currentUser = { ...currentUser, ...updated };
              if (typeof auth !== 'undefined') auth.setUser(currentUser);
            }
            avatarImg.src = url;
            avatarUrlStatus.textContent = 'Saved!';
            setTimeout(closeAvatarForm, 900);
          } catch (err) {
            const detail = err && err.message ? err.message : 'Unknown error';
            console.error('[profile] PUT /profile failed:', detail, err);
            avatarUrlStatus.textContent = `Error: ${detail}`;
            avatarUrlStatus.className = 'avatar-url-status error';
          } finally {
            avatarUrlSave.disabled = false;
          }
        });
      }

      // ── Preferred languages edit ──────────────────────────────────────────
      let allLanguages = [];
      try {
        allLanguages = await api.get('/languages') || [];
      } catch (_err) {
        allLanguages = [];
      }

      const populateLangCheckboxes = () => {
        if (!langCheckboxList) return;
        langCheckboxList.innerHTML = '';
        const selectedIds = new Set(
          (currentUser && currentUser.preferredLanguages || []).map(l => String(l.id))
        );
        allLanguages.forEach((lang) => {
          const label = document.createElement('label');
          label.className = 'lang-checkbox-item';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = String(lang.id);
          checkbox.checked = selectedIds.has(String(lang.id));
          const span = document.createElement('span');
          span.textContent = lang.name;
          label.appendChild(checkbox);
          label.appendChild(span);
          langCheckboxList.appendChild(label);
        });
      };

      if (langEditBtn && langEditPanel) {
        langEditBtn.addEventListener('click', () => {
          const isOpen = langEditPanel.classList.contains('open');
          if (isOpen) {
            langEditPanel.classList.remove('open');
            langEditBtn.textContent = 'Edit';
            if (langSaveStatus) langSaveStatus.textContent = '';
          } else {
            populateLangCheckboxes();
            langEditPanel.classList.add('open');
            langEditBtn.textContent = 'Cancel';
          }
        });
      }

      if (langSaveBtn && langCheckboxList) {
        langSaveBtn.addEventListener('click', async () => {
          const checkboxes = langCheckboxList.querySelectorAll('input[type="checkbox"]:checked');
          const selectedIds = Array.from(checkboxes).map(cb => Number(cb.value));

          langSaveBtn.disabled = true;
          if (langSaveStatus) langSaveStatus.textContent = 'Saving…';

          try {
            const updated = await api.put(`/users/${currentUser.id}/profile`, { preferredLanguageIds: selectedIds });
            if (updated) {
              currentUser = { ...currentUser, ...updated };
              if (typeof auth !== 'undefined') auth.setUser(currentUser);
            }
            renderPreferredLanguages(currentUser.preferredLanguages || []);
            if (langSaveStatus) langSaveStatus.textContent = 'Saved!';
            setTimeout(() => {
              if (langEditPanel) langEditPanel.classList.remove('open');
              langEditBtn.textContent = 'Edit';
              if (langSaveStatus) langSaveStatus.textContent = '';
            }, 1200);
          } catch (_err) {
            if (langSaveStatus) langSaveStatus.textContent = 'Error saving';
          } finally {
            langSaveBtn.disabled = false;
          }
        });
      }

      // ── Submissions & stats ───────────────────────────────────────────────
      if (submissionsCountElement) {
        try {
          const submissions = normalizeApiList(await api.get('/submissions/mine'));
          if (Array.isArray(submissions)) {
            allMineSubmissions = submissions.slice();
            const inProgressStatuses = new Set(['QUEUED', 'RUNNING']);
            const inProgressCount = submissions.filter(submission => {
              const status = submission && submission.status ? String(submission.status).toUpperCase() : '';
              return inProgressStatuses.has(status);
            }).length;

            submissionsCountElement.textContent = String(submissions.length);
            if (inProgressCountElement) inProgressCountElement.textContent = String(inProgressCount);

            const languageSet = new Set();
            submissions.forEach((submission) => {
              if (!submission) return;
              if (submission.languageName) { languageSet.add(String(submission.languageName)); return; }
              if (submission.languageCode) { languageSet.add(String(submission.languageCode)); return; }
              if (submission.languageId !== null && submission.languageId !== undefined) {
                languageSet.add(i18n.t('profile.languageFallback', { id: submission.languageId }));
              }
            });
            setUsedLanguages(Array.from(languageSet));

            if (submissions.length === 0) {
              setDifficultyCounts(0, 0, 0);
              renderMySubmissions([], lastProblemLookup, { view: 'all', bestSubmissionId: null });
            } else {
              let problemLookupById = new Map();
              try {
                problemLookupById = await loadProblemLookupForSubmissions(submissions);
              } catch (_error) {
                setDifficultyCounts(ERROR_COUNT, ERROR_COUNT, ERROR_COUNT);
              }

              const problemDifficultyById = new Map();
              problemLookupById.forEach((problem, problemId) => {
                if (problem && problem.difficulty) {
                  problemDifficultyById.set(problemId, String(problem.difficulty).toUpperCase());
                }
              });

              if (currentSubmissionView === 'all') {
                renderMySubmissions(submissions, problemLookupById, { view: 'all', bestSubmissionId: null });
              } else {
                renderMySubmissions(lastSubmissions, problemLookupById, {
                  view: currentSubmissionView,
                  bestSubmissionId,
                });
              }

              if (problemDifficultyById.size > 0) {
                let easyCount = 0, mediumCount = 0, hardCount = 0;
                submissions.forEach(submission => {
                  const difficulty = problemDifficultyById.get(String(submission.problemId));
                  if (difficulty === 'EASY') easyCount += 1;
                  else if (difficulty === 'MEDIUM') mediumCount += 1;
                  else if (difficulty === 'HARD') hardCount += 1;
                });
                setDifficultyCounts(easyCount, mediumCount, hardCount);
              }
            }
          } else {
            submissionsCountElement.textContent = ERROR_COUNT;
            if (inProgressCountElement) inProgressCountElement.textContent = ERROR_COUNT;
            setDifficultyCounts(ERROR_COUNT, ERROR_COUNT, ERROR_COUNT);
            setUsedLanguages([i18n.t('common.error')]);
            allMineSubmissions = [];
            renderMySubmissions([], undefined, { view: 'all' });
          }
        } catch (_error) {
          submissionsCountElement.textContent = ERROR_COUNT;
          if (inProgressCountElement) inProgressCountElement.textContent = ERROR_COUNT;
          setDifficultyCounts(ERROR_COUNT, ERROR_COUNT, ERROR_COUNT);
          setUsedLanguages([i18n.t('common.error')]);
          allMineSubmissions = [];
          showSubmissionsMessage('profile.couldNotReachServer');
        }
      }

      if (currentUser && currentUser.id && typeof api !== 'undefined') {
        try {
          const createdProblems = normalizeApiList(await api.get(`/problems/by-author/${currentUser.id}`));
          if (Array.isArray(createdProblems)) {
            if (createdCountElement) createdCountElement.textContent = String(createdProblems.length);
            renderMyProblems(createdProblems);
          } else {
            if (createdCountElement) createdCountElement.textContent = ERROR_COUNT;
            const container = document.getElementById('my-problems-container');
            if (container) container.innerHTML = `<p class="profile-empty">${getText('profile.couldNotLoadProblems')}</p>`;
          }
        } catch (_error) {
          if (createdCountElement) createdCountElement.textContent = ERROR_COUNT;
          const container = document.getElementById('my-problems-container');
          if (container) container.innerHTML = `<p class="profile-empty">${getText('profile.couldNotReachServer')}</p>`;
        }
      }
    });
  </script>

</body>
</html>
