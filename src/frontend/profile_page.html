<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — LeetCode Mini</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />

  <style>
    .profile-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem var(--page-padding);
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 1.5rem;
      align-items: start;
    }


    .avatar-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .avatar {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      border: 3px solid var(--border);
      overflow: hidden;
      background: var(--panel);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-name {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--white);
    }

    .profile-role {
      font-size: 0.78rem;
      color: var(--text-mid);
    }

    .sidebar-section-title {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 0 1.25rem 0.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.25rem;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      padding: 0.75rem 1.25rem 1.25rem;
    }

    /* ── Right column ── */
    .profile-main {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .stat-box {
      background: var(--card);
      padding: 1.25rem 1rem;
      text-align: center;
      transition: background 0.2s;
    }
    .stat-box:hover { background: var(--panel); }

    .stat-number {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      margin-bottom: 0.3rem;
    }
    .stat-number.green  { color: var(--green); }
    .stat-number.orange { color: var(--orange); }
    .stat-number.red    { color: var(--red); }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Section header */
    .section-header {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-header::before { content: '//'; color: var(--accent); }

    /* Table columns */
    .col-title { width: 100%; }
    .col-diff  { white-space: nowrap; }
    .col-date  {
      white-space: nowrap;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .profile-page {
        grid-template-columns: 1fr;
        padding: 1.5rem 1.25rem;
      }
    }
  </style>
</head>
<body>

  <div class="accent-bar"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-logo">⌨ LeetCode Mini</a>
    <ul class="nav-links">
      <li><a href="problems.html">Problems</a></li>
      <li><a href="create.html">Create</a></li>
      <li><a href="login.html" class="nav-btn">Logout</a></li>
    </ul>
  </nav>

  <main class="page">
    <div class="profile-page">

      <!-- ── LEFT: Sidebar ── -->
      <aside class="profile-sidebar anim-fade-up anim-delay-1">

        <!-- Avatar + name -->
        <div class="card avatar-card">
          <div class="avatar" aria-hidden="true">
            <img
              class="avatar-img"
              src="https://i.pravatar.cc/320?img=12"
              alt="Profile avatar"
            />
          </div>
          <p class="profile-name">username</p>
          <span class="badge badge--blue">is_active</span>
          <p class="profile-role">Software Quality · Deusto</p>
        </div>

        <!-- Favourite tags -->
        <div class="card" style="padding: 1rem 0 0.25rem;">
          <p class="sidebar-section-title">Used Lenguajes</p>
          <div class="tag-list">
            <span class="badge badge--blue">Example 1</span>
            <span class="badge badge--blue">Example 2</span>
            <span class="badge badge--blue">Example 3</span>
          </div>
        </div>

      </aside>

      <!-- ── RIGHT: Main content ── -->
      <div class="profile-main anim-fade-left anim-delay-2">

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-box">
            <div class="stat-number">0</div>
            <div class="stat-label">In Progress</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">0</div>
            <div class="stat-label">Created</div>
          </div>
          <div class="stat-box">
            <div class="stat-number">0</div>
            <div class="stat-label">Submissions</div>
          </div>
        </div>

        <!-- Difficulty breakdown -->
        <div class="card">
          <p class="section-header">Difficulty Breakdown (Submissions)</p>
          <div style="display: grid; grid-template-columns: repeat(3,1fr); gap: 1px; background: var(--border); border-radius: 4px; overflow: hidden;">
            <div class="stat-box">
              <div class="stat-number green">0</div>
              <div class="stat-label">Easy</div>
            </div>
            <div class="stat-box">
              <div class="stat-number orange">0</div>
              <div class="stat-label">Medium</div>
            </div>
            <div class="stat-box">
              <div class="stat-number red">0</div>
              <div class="stat-label">Hard</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="bottom-strip">
    Frontend UI · React + Tailwind CSS inspired design
  </div>

  <!-- Core utilities -->
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>

</body>
</html>
