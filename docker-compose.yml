services:
  postgres:
    image: postgres:16-alpine
    container_name: realcode
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: bspq26e8-backend:latest
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: realcode-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "10000:10000"
      - "9010:9010"

  frontend:
    image: bspq26e8-frontend:latest
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: realcode-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

  performance:
    image: grafana/k6:latest
    profiles:
      - perf
    container_name: realcode-performance
    user: "root:root"
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "6565:6565"
    volumes:
      - ./src/backend/src/test/performance:/scripts
      - ./src/backend/src/test/performance/reports:/reports
    command: run /scripts/performanceTestFail
volumes:
  postgres_data:
