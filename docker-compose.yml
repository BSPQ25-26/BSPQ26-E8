services:
  postgres:
    image: postgres:16-alpine
    container_name: realcode
    restart: unless-stopped
    environment:
      POSTGRES_DB: realcode
      POSTGRES_USER: realcode_admin
      POSTGRES_PASSWORD: 123456789
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realcode_admin -d realcode"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
